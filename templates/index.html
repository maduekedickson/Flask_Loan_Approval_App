<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Approval Machine Learning Model</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="center-content">
      <h1>Loan Approval Machine Learning Model</h1>
      <img
        src="{{ url_for('static', filename='images.jpeg') }}"
        alt="Image"
        class="center-image"
      />
    </div>
    <form action="/predict" method="post" class="center-form" id="loan-form">
      <h2>Input Data</h2>
      <div class="input-field">
        <label for="gender">Gender:</label>
        <select name="gender" id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <br />

      <div class="input-field">
        <label for="married">Married:</label>
        <select name="married" id="married" required>
          <option value="" disabled selected>Select Status</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <br />

      <div class="input-field">
        <label for="dependents">Dependents:</label>
        <input
          type="number"
          id="dependents"
          name="dependents"
          min="0"
          required
        />
      </div>
      <br />

      <div class="input-field">
        <label for="education">Education:</label>
        <select name="education" id="education" required>
          <option value="" disabled selected>Select Status</option>
          <option value="Graduate">Graduate</option>
          <option value="Not Graduate">Not Graduate</option>
        </select>
      </div>
      <br />

      <div class="input-field">
        <label for="self_employed">Self Employed:</label>
        <select name="self_employed" id="self_employed" required>
          <option value="" disabled selected>Select Status</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <br />
      <div class="input-field">
        <label for="applicant_income">Applicant Income:</label>
        <input
          type="number"
          id="applicant_income"
          name="applicant_income"
          min="0"
        />
      </div>
      <br />
      <div class="input-field">
        <label for="coapplicant_income">Coapplicant Income:</label>
        <input
          type="number"
          id="coapplicant_income"
          name="coapplicant_income"
          min="0"
        />
      </div>
      <br />

      <div class="input-field">
        <label for="loan_amount">Loan Amount:</label>
        <input type="number" id="loan_amount" name="loan_amount" min="0" />
      </div>
      <br />

      <div class="input-field">
        <label for="loan_amount_term">Loan Amount Term:</label>
        <input
          type="number"
          id="loan_amount_term"
          name="loan_amount_term"
          min="0"
        />
      </div>
      <br />

      <div class="input-field">
        <label for="credit_history">Credit History:</label>
        <select name="credit_history" id="credit_history" required>
          <option value="" disabled selected>Select</option>
          <option value="1.0">1.0</option>
          <option value="0.0">0.0</option>
        </select>
      </div>
      <br />

      <div class="input-field">
        <label for="property_area">Property Area:</label>
        <select name="property_area" id="property_area" required>
          <option value="" disabled selected>Select</option>
          <option value="Urban">Urban</option>
          <option value="Semiurban">Semiurban</option>
          <option value="Rural">Rural</option>
        </select>
      </div>
      <br />

      <button type="submit" class="submit-button" id="predict-button" disabled>
        Predict Loan Approval
      </button>
    </form>

    <div class="result">
      {% if result %}
      <div class="{{ css_class }}">{{ result }}</div>
      <button class="try-again-button" onclick="window.location.reload();">
        Try Again
      </button>
      {% endif %}
    </div>
    <br />
    <br />
    <br />
    <br />

    <!-- Footer -->
    <footer>
      <p>&copy; 2024 RiteClick. All rights reserved.</p>
    </footer>
    <script>
      // Enable/disable predict button based on form validation
      const form = document.getElementById("loan-form");
      const predictButton = document.getElementById("predict-button");

      form.addEventListener("input", () => {
        if (form.checkValidity()) {
          predictButton.disabled = false;
        } else {
          predictButton.disabled = true;
        }
      });
    </script>
    <br />
  </body>
</html>
